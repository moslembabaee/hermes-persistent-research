# Safe starter configuration for the isolated `pgra` profile.
# Provider credentials and model selection remain user-owned local configuration.
model:
  provider: auto
  default: auto
agent:
  max_turns: 60
  tool_use_enforcement: true
memory:
  # SQLite is the PGRA system of record. Enable Hermes memory later only for
  # stable user preferences, never as a substitute for programme state.
  memory_enabled: false
  user_profile_enabled: false
tools:
  # Capability preferences only. Actual availability and permission depend on the
  # installed Hermes version and the user's local setup.
  preferred_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - skills
    - todo
    - clarify
security:
  redact_secrets: true
